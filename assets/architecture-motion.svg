<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" fill="none" aria-hidden="true">
<defs><linearGradient id="gold" x1="100" y1="0" x2="850" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#f4d9ad"/><stop offset="1" stop-color="#9a7252"/></linearGradient><radialGradient id="glow"><stop stop-color="#c7a37e" stop-opacity=".19"/><stop offset="1" stop-color="#c7a37e" stop-opacity="0"/></radialGradient><style>.wire{stroke:url(#gold);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}.fine{stroke:#c9b69c;stroke-width:.65;opacity:.43}.outline{stroke-dasharray:2500;stroke-dashoffset:2500;animation:draw 4s cubic-bezier(.2,.65,.2,1) .2s forwards}.detail{opacity:0;animation:appear 2s ease 1.7s forwards}.pulse{animation:breathe 6s ease-in-out infinite}.scan{animation:sweep 7s ease-in-out infinite;transform-origin:center}.ground{opacity:.35;animation:appear 2s ease 1s both}@keyframes draw{to{stroke-dashoffset:0}}@keyframes appear{to{opacity:.65}}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.9}}@keyframes sweep{0%,100%{transform:translateY(-40px);opacity:.15}50%{transform:translateY(60px);opacity:.6}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.outline{stroke-dashoffset:0}.detail{opacity:.65}}</style></defs>
<ellipse cx="530" cy="480" rx="440" ry="350" fill="url(#glow)" class="pulse"/>
<!-- Layered glazing, illuminated interiors and a grounded shadow lend depth to the drawing. -->
<defs><linearGradient id="facade" x1="160" y1="250" x2="510" y2="670" gradientUnits="userSpaceOnUse"><stop stop-color="#9eb4ae" stop-opacity=".16"/><stop offset="1" stop-color="#172f35" stop-opacity=".58"/></linearGradient><linearGradient id="glass" x1="460" y1="190" x2="740" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#c8d4c7" stop-opacity=".18"/><stop offset=".5" stop-color="#48615f" stop-opacity=".14"/><stop offset="1" stop-color="#0e1b23" stop-opacity=".52"/></linearGradient><linearGradient id="roof" x1="160" y1="235" x2="700" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#d0b18b" stop-opacity=".23"/><stop offset="1" stop-color="#48615e" stop-opacity=".18"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="18"/></filter><style>.material{opacity:0;animation:materialize 2.8s ease 1s forwards}.light{animation:lightshift 8s ease-in-out infinite}.shadow{animation:shadowIn 2s ease .5s both}@keyframes materialize{to{opacity:1}}@keyframes lightshift{0%,100%{opacity:.25}50%{opacity:.6}}@keyframes shadowIn{from{opacity:0}to{opacity:.7}}@media(prefers-reduced-motion:reduce){.material{opacity:1}.light{opacity:.35}.shadow{opacity:.7}}</style></defs>
<ellipse cx="485" cy="735" rx="330" ry="68" fill="#050e13" opacity=".6" filter="url(#soft)" class="shadow"/>
