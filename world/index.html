<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101b20"><title>ورود به فضای خصوصی | بارچینت</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color-scheme:dark}body{background:#101b20;color:#f4efe4;font-family:Tahoma,Arial,sans-serif}.access{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);border-top:3px solid #ccb888;padding:35px 30px 29px;background:#1b2b30;box-shadow:0 12px 55px #0003;border-radius:4px}.wordmark{font:600 .8rem/1.5 Arial,sans-serif;letter-spacing:.18em;color:#d2c295;margin:0 0 16px;text-align:right}.card h1{font-size:1.6rem;line-height:1.5;margin:0 0 20px}.card label{display:block;margin:16px 0 7px;font-size:.93rem}.card input{font:inherit;width:100%;border-radius:4px;border:1px solid #85918d;background:#102024;color:#fff;padding:12px 10px;min-height:44px}.card button{width:100%;font:700 .98rem Tahoma,Arial,sans-serif;cursor:pointer;min-height:46px;border:0;border-radius:4px;background:#decd9d;color:#172321;margin-top:24px}.card button:disabled{opacity:.65;cursor:wait}.card :focus-visible{outline:3px solid #f3d28b;outline-offset:3px}#access-status{margin:14px 0 0;line-height:1.8;font-size:.87rem;min-height:1.5em;color:#e7d5a7}
</style></head><body>
<main class="access"><section class="card" aria-labelledby="access-title"><p class="wordmark" lang="en" dir="ltr">BARCHINET</p>
<h1 id="access-title">ورود به فضای خصوصی</h1>
<form id="access-form" autocomplete="on">
<label for="account">نام کاربری</label><input id="account" type="text" dir="ltr" maxlength="80" required autocapitalize="none" spellcheck="false" autocomplete="username">
<label for="password">رمز عبور</label><input id="password" type="password" dir="ltr" required autocomplete="current-password">
<button type="submit" id="unlock">ورود</button><p id="access-status" role="status" aria-live="polite"></p>
</form><noscript>برای ورود، جاوااسکریپت مرورگر را فعال کنید.</noscript>
</section></main><script src="./access.js" defer></script></body></html>
