<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1308.0 552.0" role="img" aria-labelledby="sec-title sec-desc">
<title id="sec-title">Courtyard studio, Los Angeles: daylight section</title>
<desc id="sec-desc">Section from the courtyard through the glazed bay to the north wall. At summer noon the sun is 79 degrees high and the canopy shades the glass. At winter noon it is 32 degrees high and reaches 2.9 metres into the room.</desc>
<style>
  .paper { fill: #f7f4ee; } .floor { fill: #efe9dd; } .paving { fill: #e6e1d6; } .ground { fill: #ece6d8; }
  .cut { fill: #1f2a30; stroke: #1f2a30; stroke-width: 1.2; } .cutlight { fill: url(#sec-hatch); stroke: #1f2a30; stroke-width: 1.4; }
  .thin { fill: none; stroke: #1f2a30; stroke-width: .9; } .furn { fill: #fbf9f4; stroke: #5b6a70; stroke-width: .9; }
  .soft { fill: #dfe7e4; stroke: #5b6a70; stroke-width: .9; } .timber { fill: #e3c9a0; stroke: #8a6a3c; stroke-width: .9; }
  .grid { stroke: #cfc8b9; stroke-width: .6; } .above { fill: none; stroke: #5b6a70; stroke-width: .9; stroke-dasharray: 7 5; }
  .glass { stroke: #146170; stroke-width: 2.2; } .glass2 { stroke: #f7f4ee; stroke-width: .8; }
  .plant { fill: #cfe0c4; fill-opacity: .62; stroke: #4c6b45; stroke-width: 1; } .leaf { stroke: #4c6b45; stroke-width: .8; }
  .dim { stroke: #5b6a70; stroke-width: .8; } .tick { stroke: #1f2a30; stroke-width: 1.3; }
  .dimtext { font: 500 12px Manrope, "Helvetica Neue", Arial, sans-serif; fill: #5b6a70; }
  .label { font: 600 13px Manrope, "Helvetica Neue", Arial, sans-serif; fill: #1f2a30; letter-spacing: .02em; }
  .room { font: 400 22px "Instrument Serif", Georgia, serif; fill: #1f2a30; } .small { font: 500 11px Manrope, Arial, sans-serif; fill: #5b6a70; }
  .title { font: 400 30px "Instrument Serif", Georgia, serif; fill: #1f2a30; } .sub { font: 500 12px Manrope, Arial, sans-serif; fill: #5b6a70; letter-spacing: .08em; text-transform: uppercase; }
  .sun { fill: #d9822b; fill-opacity: .28; stroke: #d9822b; stroke-width: 1; stroke-dasharray: 4 3; } .sunline { stroke: #d9822b; stroke-width: 1.4; fill: none; }
  .suntext { font: 600 12px Manrope, Arial, sans-serif; fill: #a85f16; } .shade { fill: #146170; fill-opacity: .14; stroke: #146170; stroke-width: 1; stroke-dasharray: 4 3; }
  .hot { fill: #146170; } .hot text { fill: #fff; font: 700 11px Manrope, Arial, sans-serif; } [data-anchor] { cursor: pointer; }
</style>
