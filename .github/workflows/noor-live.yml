name: Verify live Noor Studio
on:
  push:
    branches: [noor-envelope-preflight-20261118]
    paths: ['noor-live-check.py', '.github/workflows/noor-live.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Request and verify public studio and listings over HTTPS
        run: python3 noor-live-check.py
      - name: Record measured public response on preflight branch
        run: |
          git config user.name "Noor Studio Preflight"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- noor-live-result.json
          git commit -m "Record Noor Studio public URL verification"
          git push origin HEAD:refs/heads/noor-envelope-preflight-20261118
          python3 -c "import json; assert json.load(open('noor-live-result.json'))['success']"
